# qlaude CI (plan T7, spec §5.8). No secrets are used anywhere: the stub's
# dummy token is a fixed public string. No artifacts are uploaded (the dummy
# token must never appear in one — there are none, by design).
name: ci
on:
  push:
    branches: [main, 'feature/**']
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck (A1 gate, severity=style, every shell file)
        run: shellcheck -s sh --severity=style bin/qlaude install.sh tools/*.sh tests/*.sh
      - name: dash -n (POSIX parse, every shell file)
        run: |
          dash -n bin/qlaude
          dash -n install.sh
          dash -n tools/gen-checksum.sh
          for f in tests/test_*.sh tests/run_tests.sh; do dash -n "$f"; done
      - name: checksum drift (install.sha256 must match the payload)
        run: sh tools/gen-checksum.sh --check
      - name: A6 — launcher exports, contract constant and environment doc must agree
        # Spec §7 A6 extracts from the launcher's export STATEMENTS; T8
        # review round 2 showed checking only the QLAUDE_EXPORTS constant
        # leaves both drift directions unguarded. So: every constant name
        # must (a) appear in docs/environment.md and (b) still be exported by
        # cmd_launch; every name cmd_launch exports must be in the
        # constant, except the whitelist — the auth-mode branch
        # (ANTHROPIC_API_KEY) and the kill-switch check
        # (CLAUDE_CODE_AUTO_MODE_SERVER), both documented in the env doc and not
        # part of the 10-export contract.
        run: |
          _names=$(sed -n "s/^QLAUDE_EXPORTS='\(.*\)'$/\1/p" bin/qlaude)
          [ -n "$_names" ] || { echo 'A6: QLAUDE_EXPORTS constant not found' >&2; exit 1; }
          _launch=$(awk '/^cmd_launch\(\)/,/^}/' bin/qlaude \
            | grep -oE '(ANTHROPIC|CLAUDE_CODE)_[A-Z_]+' | sort -u)
          _missing=0
          for _n in $_names; do
            grep -q -- "$_n" docs/environment.md || {
              echo "A6: launcher exports $_n but docs/environment.md does not document it" >&2
              _missing=1; }
            printf '%s\n' "$_launch" | grep -qx -- "$_n" || {
              echo "A6: constant lists $_n but cmd_launch no longer exports it" >&2
              _missing=1; }
          done
          for _n in $_launch; do
            case $_n in
              ANTHROPIC_API_KEY | CLAUDE_CODE_AUTO_MODE_SERVER) continue ;;
            esac
            case " $_names " in
              *" $_n "*) ;;
              *) echo "A6: cmd_launch exports $_n but QLAUDE_EXPORTS omits it — update the contract" >&2
                 _missing=1 ;;
            esac
          done
          exit "$_missing"
      - name: offline suite (A1-A6 — stub plus every tests/test_*.sh)
        # The suite is the product's acceptance harness; if CI never runs
        # it, every pin in it is decoration (T7 review finding).
        run: sh tests/run_tests.sh
      - name: public-repo hygiene grep
        # Each forbidden word is split by shell string concatenation so this
        # file does not match its own grep (the concatenation is resolved at
        # runtime; the file text never contains a contiguous forbidden word).
        run: |
          if grep -rniE --exclude-dir=.git \
              -e 'b2''00' -e 'trail''openers' -e 'ha''lo' \
              -e 'wig''olo' -e 'turu''nen\.in' . ; then
            echo 'hygiene grep matched — this repo is public' >&2
            exit 1
          fi

  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: one config dir + stub mode for every qlaude call in this job
        # SYSTEM-PROMPT.md is installed into QLAUDE_CONFIG_DIR and doctor's
        # step 0 requires it there — installer and doctor must never
        # disagree (that disagreement broke the first CI run). QLAUDE_STUB=1
        # must cover the setup tail's gauntlet too, or step 3 records a
        # PASS from the stub echoing the probe prompt back — spec §5.8:
        # "SKIP is honest, faked PASS is not". Exported once here
        # ($GITHUB_ENV reaches every later step); the runner context is
        # not legal in job-level env, hence this form.
        run: |
          echo "QLAUDE_CONFIG_DIR=$RUNNER_TEMP/conf" >> "$GITHUB_ENV"
          echo "QLAUDE_STUB=1" >> "$GITHUB_ENV"
      - name: install claude code (official channel, pinned version)
        run: npm install -g @anthropic-ai/claude-code@2.1.325
      - name: pin line — version actually installed + help contract
        run: |
          claude --version | tee "$RUNNER_TEMP/claude.version"
          echo "PINNED=2.1.325 INSTALLED=$(cat "$RUNNER_TEMP/claude.version")" >> "$GITHUB_STEP_SUMMARY"
          claude --help > "$RUNNER_TEMP/claude.help" 2>&1
          grep -q -- '--allowedTools' "$RUNNER_TEMP/claude.help" || {
            echo 'claude --help lost --allowedTools — probes would violate C7' >&2; exit 1; }
          # --bare is used by probes ONLY if listed; qlaude's probes use the
          # isolated-HOME path, so an absent --bare is fine but gets recorded.
          grep -q -- '--bare' "$RUNNER_TEMP/claude.help" \
            && echo 'bare=listed' >> "$GITHUB_STEP_SUMMARY" \
            || echo 'bare=absent (isolated-HOME probe path)' >> "$GITHUB_STEP_SUMMARY"
      - name: start enforcing stub
        run: |
          QLAUDE_CI_TOKEN=qlaude-ci-dummy-token-8f31 \
          QLAUDE_STUB_PORTFILE="$RUNNER_TEMP/stub.port" \
            python3 tests/stub_server.py &
          for i in $(seq 50); do [ -s "$RUNNER_TEMP/stub.port" ] && break; sleep 0.1; done
          [ -s "$RUNNER_TEMP/stub.port" ] || { echo 'stub did not start' >&2; exit 1; }
          echo "STUB_PORT=$(cat "$RUNNER_TEMP/stub.port")" >> "$GITHUB_ENV"
      - name: installer from this commit (checksum-verified fetch)
        # On pull_request events GITHUB_SHA is the merge commit, which
        # raw.githubusercontent does not serve — fetch the PR head commit.
        env:
          FETCH_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          QLAUDE_BASE_URL=https://raw.githubusercontent.com/randomm/qlaude \
          QLAUDE_REF="$FETCH_REF" \
          QLAUDE_INSTALL_DIR="$RUNNER_TEMP/bin" \
            sh install.sh
          test -x "$RUNNER_TEMP/bin/qlaude"
      - name: setup -y against the stub, then doctor (A2/A3)
        run: |
          printf '%s\n' qlaude-ci-dummy-token-8f31 | \
            "$RUNNER_TEMP/bin/qlaude" setup -y --token-stdin \
              --endpoint "http://127.0.0.1:${STUB_PORT}" \
              --model stub-model \
              --claude-bin "$(command -v claude)"
          "$RUNNER_TEMP/bin/qlaude" doctor
          # config must be 0600 (spec §5.2)
          test "$(ls -l "${{ runner.temp }}/conf/config.env" | cut -c2-10)" = "rw-------"
      - name: auto-mode classifier billing (docs 2026-11 contract)
        # code.claude.com/docs/en/auto-mode-classifier-billing: the stub cannot
        # return safeguard_results, so with server checks ON the pinned CLI
        # prints the ineligibility notice to stderr under -p; qlaude's default
        # export (CLAUDE_CODE_AUTO_MODE_SERVER=0) must suppress it entirely.
        run: |
          # --model verbatim, like the gauntlet probes: the stub validates model
          # ids on -p sessions too (unrecognized_model otherwise).
          "$RUNNER_TEMP/bin/qlaude" launch -p --model stub-model 'say OK' >"$RUNNER_TEMP/am.off.out" 2>"$RUNNER_TEMP/am.off.err" || true
          if grep -qi "isn't eligible" "$RUNNER_TEMP/am.off.err"; then
            echo 'FAIL: notice appeared although the launcher exports =0' >&2
            cat "$RUNNER_TEMP/am.off.err" >&2; exit 1; fi
          QLAUDE_AUTO_MODE_SERVER=on "$RUNNER_TEMP/bin/qlaude" launch -p --model stub-model 'say OK' >/dev/null 2>"$RUNNER_TEMP/am.on.err" || true
          if grep -qi "isn't eligible" "$RUNNER_TEMP/am.on.err"; then
            # The stub cannot answer safeguard_results, so with checks ON the
            # docs say the notice must print under -p; then our default export
            # must silence it. Differential proven.
            echo 'auto-mode notice: present on opt-in, suppressed by default' >> "$GITHUB_STEP_SUMMARY"
          else
            # Pinned CLI stayed silent against the stub (notice machinery not
            # reached on this transport). Suppression-by-default is asserted by
            # the offline env-capture suite; keep this leg as drift tripwire.
            echo 'auto-mode notice: not emitted by pinned CLI vs stub (INFO; default-off asserted offline)' >> "$GITHUB_STEP_SUMMARY"
          fi

  dash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install claude code (for the doctor probe)
        run: npm install -g @anthropic-ai/claude-code@2.1.325
      - name: fresh chain re-run under dash in a clean HOME
        env:
          FETCH_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          CH=$(mktemp -d)
          QLAUDE_CI_TOKEN=qlaude-ci-dummy-token-8f31 \
          QLAUDE_STUB_PORTFILE="$CH/stub.port" \
            python3 "$GITHUB_WORKSPACE/tests/stub_server.py" &
          for i in $(seq 50); do [ -s "$CH/stub.port" ] && break; sleep 0.1; done
          STUB_PORT=$(cat "$CH/stub.port")
          HOME="$CH" QLAUDE_CI_TOKEN=qlaude-ci-dummy-token-8f31 \
          QLAUDE_BASE_URL=https://raw.githubusercontent.com/randomm/qlaude \
          QLAUDE_REF="$FETCH_REF" \
          QLAUDE_INSTALL_DIR="$CH/bin" QLAUDE_CONFIG_DIR="$CH/conf" \
          QLAUDE_STUB=1 STUB_PORT="$STUB_PORT" CLAUDE_BIN="$(command -v claude)" \
          dash -c 'sh "$GITHUB_WORKSPACE/install.sh" \
            && printf %s\\n "$QLAUDE_CI_TOKEN" | "$QLAUDE_INSTALL_DIR/qlaude" setup -y --token-stdin --endpoint "http://127.0.0.1:$STUB_PORT" --model stub-model --claude-bin "$CLAUDE_BIN" \
            && QLAUDE_STUB=1 "$QLAUDE_INSTALL_DIR/qlaude" doctor \
            && "$QLAUDE_INSTALL_DIR/qlaude" config >/dev/null'

  negative:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install claude code (step 0 needs a real claude binary)
        run: npm install -g @anthropic-ai/claude-code@2.1.325
      - name: doctor with the WRONG token must exit 3 with the auth hint
        run: |
          CH=$(mktemp -d)
          QLAUDE_CI_TOKEN=qlaude-ci-dummy-token-8f31 \
          QLAUDE_STUB_PORTFILE="$CH/stub.port" \
            python3 "$GITHUB_WORKSPACE/tests/stub_server.py" &
          for i in $(seq 50); do [ -s "$CH/stub.port" ] && break; sleep 0.1; done
          STUB_PORT=$(cat "$CH/stub.port")
          mkdir -p "$CH/conf"
          printf 'QLAUDE_ENDPOINT=http://127.0.0.1:%s\nQLAUDE_MODEL=stub-model\nQLAUDE_TOKEN=definitely-wrong\n' \
            "$STUB_PORT" > "$CH/conf/config.env"
          chmod 600 "$CH/conf/config.env"
          cp "$GITHUB_WORKSPACE/SYSTEM-PROMPT.md" "$CH/conf/"
          set --; QLAUDE_CONFIG_DIR="$CH/conf" HOME="$CH" \
            sh "$GITHUB_WORKSPACE/bin/qlaude" doctor > "$CH/doc.out" 2>&1 || set -- "$?"
          [ "${1:-0}" = 3 ] || { echo "expected exit 3, got ${1:-0}" >&2; cat "$CH/doc.out" >&2; exit 1; }
          grep -qiE 'auth|token|401|403' "$CH/doc.out" || {
            echo 'auth hint missing — stub gullibility not excluded' >&2; exit 1; }
      # spec §5.8 + A2 name the REMOVED-token case specifically: distinct
      # branch (short-circuits before curl), so it needs its own proof.
      - name: doctor with the token REMOVED must exit 3 with the hint
        run: |
          CH2=$(mktemp -d); mkdir -p "$CH2/conf"
          printf 'QLAUDE_ENDPOINT=http://127.0.0.1:1\nQLAUDE_MODEL=stub-model\n' \
            > "$CH2/conf/config.env"
          chmod 600 "$CH2/conf/config.env"
          cp "$GITHUB_WORKSPACE/SYSTEM-PROMPT.md" "$CH2/conf/"
          set --; QLAUDE_CONFIG_DIR="$CH2/conf" HOME="$CH2" \
            sh "$GITHUB_WORKSPACE/bin/qlaude" doctor > "$CH2/doc.out" 2>&1 || set -- "$?"
          [ "${1:-0}" = 3 ] || { echo "expected exit 3, got ${1:-0}" >&2; cat "$CH2/doc.out" >&2; exit 1; }
          grep -qiE 'no token|token.*setup|qlaude setup' "$CH2/doc.out" || {
            echo 'removed-token hint missing' >&2; exit 1; }
